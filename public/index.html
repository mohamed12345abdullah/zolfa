<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>اختيار نوع التسجيل</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f5;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
        }

        .options {
            display: flex;
            gap: 20px;
        }

        .option {
            width: 200px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            text-decoration: none;
            color: #222;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: 0.2s;
        }

        .option:hover {
            transform: translateY(-5px);
        }

        .option h2 {
            margin: 0 0 10px;
        }

        .option p {
            margin: 0;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>اختر نوع التسجيل</h1>

        <div class="options">

            <!-- صفحة الرجل -->
            <a href="./male.html" class="option">
                <h2>رجل</h2>
                <p>التسجيل كزوج</p>
            </a>

            <!-- صفحة المرأة -->
            <a href="./female.html" class="option">
                <h2>امرأة</h2>
                <p>التسجيل كزوجة</p>
            </a>

        </div>

    </div>

</body>
</html>
